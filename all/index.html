<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookmark Explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <p class="eyebrow">Saved links</p>
        <h1>Bookmark Explorer</h1>
      </header>

      <form id="search-form" class="search-panel" role="search">
        <label class="search-label" for="bookmark-search">Search bookmarks</label>
        <div class="search-input-wrap">
          <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
          <input id="bookmark-search" type="search" placeholder="Search by name or URL" autocomplete="off" />
          <button id="clear-search" class="clear-search" type="button" aria-label="Clear search" title="Clear search" hidden>
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
          </button>
        </div>
        <p id="search-status" class="search-status" aria-live="polite"></p>
      </form>

      <section id="bookmarks-root" class="bookmark-tree" aria-live="polite"></section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
